name: KOTV Flutter Win7 (Experimental)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # 官方最后支持 Win7 的稳定版；不再用 3.24 + 魔改 engine。
  FLUTTER_VERSION: "3.19.6"

jobs:
  build-flutter-win7:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install go-legacy-win7
        shell: pwsh
        run: |
          $ver = "1.26.5-1"
          $zip = "go-legacy-win7-$ver.windows_amd64.zip"
          $url = "https://github.com/thongtech/go-legacy-win7/releases/download/v$ver/$zip"
          curl.exe -sSL -o "$env:RUNNER_TEMP\$zip" $url
          Expand-Archive -Path "$env:RUNNER_TEMP\$zip" -DestinationPath "C:\" -Force
          echo "GOROOT=C:\go-legacy-win7" >> $env:GITHUB_ENV
          echo "C:\go-legacy-win7\bin" >> $env:GITHUB_PATH
          & "C:\go-legacy-win7\bin\go.exe" version

      - name: Install MSVCRT MinGW (Win7-safe CGO)
        shell: pwsh
        run: |
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/15.2.0-rt_v13-rev1/x86_64-15.2.0-release-win32-seh-msvcrt-rt_v13-rev1.7z"
          curl.exe -sSL -o "$env:RUNNER_TEMP\mingw.7z" $url
          7z x "$env:RUNNER_TEMP\mingw.7z" -o"C:\mingw-msvcrt" | Out-Null
          Get-ChildItem -Path "C:\mingw-msvcrt" -Recurse -Filter "libwinpthread.dll.a" -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Force $_.FullName }
          Get-ChildItem -Path "C:\mingw-msvcrt" -Recurse -Filter "libpthread.dll.a" -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Force $_.FullName }
          echo "C:\mingw-msvcrt\mingw64\bin" >> $env:GITHUB_PATH
          & "C:\mingw-msvcrt\mingw64\bin\gcc.exe" --version

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup MSVC (Flutter Windows desktop)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare runtime + build Win7 engine
        shell: bash
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
          CGO_CFLAGS: "-O2"
          CGO_CXXFLAGS: "-O2"
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -l:libwinpthread.a -Wl,-Bdynamic"
          KOTV_JAVA_TOOLCHAIN: "21"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/prepare-runtime.sh windows-x64
          ./scripts/verify-runtime.sh runtime windows-x64
          (cd internal/spider && go run gen_qjsinc.go)
          # 避免 assets 里残留的 mac/linux kotv-engine 被 CMake 装进 Win 包。
          rm -f flutter/assets/engine/kotv-engine
          go build -ldflags "-s -w -extldflags '-static-libgcc -static-libstdc++ -Wl,-Bstatic -l:libwinpthread.a -Wl,-Bdynamic -Wl,--subsystem,windows:6.01'" \
            -o flutter/assets/engine/kotv-engine.exe ./cmd/engine
          pwsh -File ./scripts/check-win7-deps.ps1 -Exe "flutter/assets/engine/kotv-engine.exe"

      - name: Build Flutter Windows release (3.19.6 / Win7)
        shell: pwsh
        run: |
          Set-Location flutter
          flutter --version
          flutter config --enable-windows-desktop
          flutter precache --windows

          # 主线 pubspec 面向 3.24+；Win7 线临时放宽到 Dart 3.3
          bash ../scripts/adapt-flutter-win7-sdk.sh

          flutter pub get
          flutter build windows --release

      - name: Bundle engine and verify runtime
        shell: pwsh
        run: |
          $out = "flutter\build\windows\x64\runner\Release"
          if (-not (Test-Path "$out\kotv.exe")) { throw "Flutter build output missing: $out\kotv.exe" }
          Copy-Item -Force "flutter\assets\engine\kotv-engine.exe" "$out\kotv-engine.exe"
          # 兜底：清掉无后缀的 kotv-engine（历史 CMake 可能装过）。
          if (Test-Path "$out\kotv-engine") { Remove-Item -Force "$out\kotv-engine" }

          # runtime 只由 Windows CMake install 打一次；禁止二次整目录拷贝。
          if (-not (Test-Path "$out\runtime")) {
            throw "CMake did not install runtime under $out\runtime — check flutter/windows/CMakeLists.txt"
          }
          if (Test-Path "$out\runtime\runtime") {
            throw "nested runtime\runtime detected — packaging must be single-layer"
          }

          if (Test-Path "cmd\updater\updater.exe") { Copy-Item -Force "cmd\updater\updater.exe" "$out\updater.exe" }

          bash ./scripts/strip-runtime-launchers.sh "$out/runtime"
          $env:KOTV_EXPECT_EMBED_STRIP = "1"
          bash ./scripts/verify-runtime.sh "$out/runtime" windows-x64
          if (Test-Path "$out\runtime\jre\bin\java.exe") { throw "java.exe must be stripped from Flutter runtime" }
          if (Test-Path "$out\runtime\python\python.exe") { throw "python.exe must be stripped from Flutter runtime" }

      - name: Compress ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev" }
          Compress-Archive -Path "flutter\build\windows\x64\runner\Release\*" -DestinationPath "./KOTV-flutter-win7-experimental-${tag}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-win7-experimental
          path: KOTV-flutter-win7-experimental-*.zip
