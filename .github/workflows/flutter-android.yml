# 已并入 github-action.yml（build-android）。此处仅保留手动触发，避免重复编译。
name: KOTV Flutter Android (manual)

on:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FLUTTER_VERSION: "3.47.6"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # 镜像预装的 dotnet、模拟器和旧 NDK 占满磁盘后，Gradle 下载会失败。
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已下架旧 SDK `tools` 包；默认 packages 含 tools 会失败。
          packages: platform-tools

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
          add-to-path: false

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK (compileSdk 37.0)
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          sdkmanager --list_installed 2>/dev/null | grep -E 'platforms;android-3|build-tools' || true

      - name: Install Android MPV host build deps
        run: |
          sudo apt-get update
          # fontconfig 2.18.3 要求 meson>=1.11；Ubuntu apt 仍是 1.10.x，改 pip。
          sudo apt-get install -y --no-install-recommends \
            gperf ninja-build nasm pkg-config wget \
            python3-pip python3-setuptools
          sudo pip3 install --upgrade 'meson>=1.11'
          command -v gperf
          command -v meson
          meson --version
          command -v ninja

      - name: Cache Android MPV native suite (jniLibs + Vulkan stub)
        uses: actions/cache@v4
        with:
          path: |
            flutter/android/app/src/main/assets/mpv-libs
            flutter/android/app/src/main/jniLibs/arm64-v8a
            flutter/android/app/src/main/jniLibs/armeabi-v7a
            .build/android-mpv-src
          key: android-mpv-native-${{ hashFiles('scripts/prepare-android-mpv-native.sh', 'scripts/build-android-mpv-from-source.sh', 'scripts/kotv-patch-mpv-android-cmake.sh', 'scripts/build-android-libvulkan-stub.sh', 'scripts/build-android-kotv-dl.sh', 'scripts/android-mpv-lib-names.sh', 'scripts/verify-android-mpv-libs.sh', 'flutter/android/native/vkcompat/vkcompat.c', 'flutter/android/native/kotv_dl/kotv_dl.c') }}
          restore-keys: |
            android-mpv-native-

      - name: Cache FongMi Media3 maven + checkout
        uses: actions/cache@v4
        with:
          path: |
            flutter/android/third_party/maven-webhtv
            .tmp/fongmi-media
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fongmi-media3-1.11.0-alpha01-${{ runner.os }}-${{ hashFiles('scripts/build-fongmi-media3.sh', 'scripts/fetch-android-exo-av3a.sh') }}
          restore-keys: |
            fongmi-media3-1.11.0-alpha01-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Package Android APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CHAQUOPY_BUILD_PYTHON: python3.10
          KOTV_JAVA_TOOLCHAIN: "17"
          KOTV_TARGET_SDK: "28"
        run: |
          chmod +x scripts/*.sh
          python3.10 --version
          ./scripts/package-flutter-android.sh
          ls -lh dist/KO影视-*.apk

      # Upload 只需 dist/*.apk；清中间产物降盘压，避免 runner 在 archive 阶段失联。
      - name: Free disk before Android upload
        run: |
          df -h /
          du -sh dist flutter/build .tmp/fongmi-media ~/.gradle 2>/dev/null || true
          rm -rf flutter/build .tmp/fongmi-media
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          compression-level: 0
          name: android-aarch64
          path: dist/KO影视-*-aarch64.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          compression-level: 0
          name: android-armv7
          path: dist/KO影视-*-armv7.apk
          if-no-files-found: error
