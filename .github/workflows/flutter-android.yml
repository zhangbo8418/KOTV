# 已并入 github-action.yml（build-android）。此处仅保留手动触发，避免重复编译。
name: KOTV Flutter Android (manual)

on:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FLUTTER_VERSION: "3.44.8"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
          add-to-path: false

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK for FongMi Media3 (compileSdk 36)
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null
          sdkmanager --list_installed 2>/dev/null | grep -E 'platforms;android-36|build-tools' || true

      - name: Install Android native build tools
        run: sudo apt-get update && sudo apt-get install -y patchelf gperf autoconf automake libtool nasm yasm pkg-config meson ninja-build

      - name: Cache Android MPV source build
        uses: actions/cache@v4
        with:
          path: |
            .build/android-mpv-src
            flutter/android/app/src/main/assets/mpv-libs
            flutter/android/app/src/main/jniLibs/arm64-v8a
            flutter/android/app/src/main/jniLibs/armeabi-v7a
          key: android-mpv-src-${{ hashFiles('scripts/build-android-mpv-from-source.sh') }}
          restore-keys: |
            android-mpv-src-

      - name: Cache FongMi Media3 maven + checkout
        uses: actions/cache@v4
        with:
          path: |
            flutter/android/third_party/maven-webhtv
            .tmp/fongmi-media
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fongmi-media3-1.11.0-alpha01-${{ runner.os }}-${{ hashFiles('scripts/build-fongmi-media3.sh', 'scripts/fetch-android-exo-av3a.sh') }}
          restore-keys: |
            fongmi-media3-1.11.0-alpha01-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Package Android APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CHAQUOPY_BUILD_PYTHON: python3.10
          KOTV_JAVA_TOOLCHAIN: "17"
          KOTV_TARGET_SDK: "28"
        run: |
          chmod +x scripts/*.sh
          python3.10 --version
          ./scripts/package-flutter-android.sh
          ls -lh dist/KO影视-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/KO影视-*-aarch64.apk
            dist/KO影视-*-armv7.apk
          if-no-files-found: error
