# Web 包 = 引擎同端口放出 Flutter Web（不进 PC/Android/iOS 客户端包）
name: KOTV Flutter Web

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libmpv2 libmpv-dev vlc vlc-plugin-base libvlc-dev unzip curl zip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Package Web (engine + webapp @ :9978)
        env:
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
        run: |
          flutter config --enable-web
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/package-flutter-web.sh linux-x64
          test -f dist/KOTV-web-linux-x64/webapp/index.html
          test -x dist/KOTV-web-linux-x64/kotv-engine || test -f dist/KOTV-web-linux-x64/kotv-engine
          ls -lh dist/KO影视-*-web-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: |
            dist/KO影视-*-web-linux-x86_64.zip
            dist/KO影视-*-web-static.zip
          if-no-files-found: error
