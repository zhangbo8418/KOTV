# Flutter UI + Go 引擎：全平台打包（含 Windows 安装包 / Win7 / Android）→ GitHub Release
name: KOTV Build
on:
  workflow_dispatch:
  push:
    branches: [main, master, restore-sidecar, "release/**"]
    tags: ["v*"]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # 与 scripts/kotv-flutter-pins.sh 保持一致
  FLUTTER_VERSION: "3.50.1"
  FLUTTER_WINDOWS_VERSION: "3.47.1"
  FLUTTER_WIN7_VERSION: "3.19.6"
  KOTV_DCOMP_ENGINE_TAG: "windows-v3.47.1+2"
  KOTV_DCOMP_ENGINE_VER: "3.47.1"
  KOTV_GO_LEGACY_WIN7_VER: "1.27.4-1"

jobs:
  set-tag:
    uses: ./.github/workflows/set-tag-workflow.yml

  build-updater:
    uses: ./.github/workflows/build-updater.yml
    with:
      release_tag: ${{ needs.set-tag.outputs.tag }}
    needs: [set-tag]

  # Win10+ Flutter x86_64：ZIP + Inno 安装包
  build-win-amd64:
    runs-on: windows-2022
    needs: [set-tag, build-updater]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install go-legacy-win7
        shell: pwsh
        run: ./scripts/ci-install-go-legacy-win7.ps1

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Install MSVCRT MinGW (Win7-safe CGO)
        shell: pwsh
        run: ./scripts/ci-install-mingw-msvcrt.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_WINDOWS_VERSION }}
          channel: stable
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-amd64
          path: cmd/updater

      - name: Install desktop MPV source deps
        shell: bash
        run: |
          chmod +x scripts/ci-ensure-windows-mpv-host-deps.sh
          ./scripts/ci-ensure-windows-mpv-host-deps.sh

      - name: Build desktop libmpv (Vulkan + AV3A source)
        shell: bash
        env:
          KOTV_FETCH_DESKTOP_PLAT: windows
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          export PATH="/c/Strawberry/perl/bin:/c/mingw-msvcrt/mingw64/bin:/c/Program Files/NASM:/c/ProgramData/chocolatey/bin:$PATH"
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter Windows
        shell: bash
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
          CGO_CFLAGS: "-O2"
          CGO_CXXFLAGS: "-O2"
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -l:libwinpthread.a -Wl,-Bdynamic"
          KOTV_JAVA_TOOLCHAIN: "21"
          KOTV_DCOMP_ENGINE_TAG: ${{ env.KOTV_DCOMP_ENGINE_TAG }}
          KOTV_DCOMP_ENGINE_VER: ${{ env.KOTV_DCOMP_ENGINE_VER }}
          # windows-2022 / 新 Flutter：强制 VS2022，避免落到缺失的 VS2019
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/package-flutter-windows.sh

      - name: Build installer
        shell: pwsh
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          $ver = $env:TAG.TrimStart("v")
          choco install innosetup -y --no-progress
          ./scripts/make-win-installer.ps1 `
            -Plat windows-x64 `
            -Tag $env:TAG `
            -Version $ver `
            -SourceDir "flutter\build\windows\x64\runner\Release" `
            -ExeName kotv.exe
          Get-ChildItem "KO影视-${ver}-x86_64*" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: win-x86_64
          path: |
            KO影视-*-x86_64.zip
            KO影视-*-x86_64-setup.exe
          if-no-files-found: error

  # Windows arm64 桌面包（原生 windows-11-arm；Flutter/DComp 钉死同 x64，见 kotv-flutter-pins.sh）
  build-win-arm64:
    runs-on: windows-11-arm
    needs: [set-tag, build-updater]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Ensure Flutter
        shell: bash
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_WINDOWS_VERSION }}
        run: |
          chmod +x scripts/ci-ensure-flutter.sh
          ./scripts/ci-ensure-flutter.sh
          flutter precache --windows || true

      - name: Setup MSVC (Flutter Windows)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # Go CGO（quickjs / runtime/cgo gcc_arm64.S）必须用 llvm-mingw aarch64，
      # 不能用 choco LLVM 的泛 clang（会按错误 target 汇编）。
      - name: Install llvm-mingw aarch64 (CGO)
        shell: pwsh
        run: |
          $ver = "20260616"
          $zip = "llvm-mingw-$ver-ucrt-aarch64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$zip"
          curl.exe -sSL -o "$env:RUNNER_TEMP\$zip" $url
          Expand-Archive -Path "$env:RUNNER_TEMP\$zip" -DestinationPath "C:\llvm-mingw" -Force
          $clang = Get-ChildItem -Path "C:\llvm-mingw" -Recurse -Filter "aarch64-w64-mingw32-clang.exe" |
            Select-Object -First 1
          if (-not $clang) { throw "aarch64-w64-mingw32-clang.exe not found under C:\llvm-mingw" }
          $bin = $clang.DirectoryName
          echo $bin >> $env:GITHUB_PATH
          & $clang.FullName --version

      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-arm64
          path: cmd/updater

      - name: Install desktop MPV source deps
        shell: bash
        run: |
          chmod +x scripts/ci-ensure-windows-mpv-host-deps.sh
          ./scripts/ci-ensure-windows-mpv-host-deps.sh

      - name: Build desktop libmpv (Vulkan + AV3A source)
        shell: bash
        env:
          KOTV_FETCH_DESKTOP_PLAT: windows
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          export PATH="/c/Strawberry/perl/bin:/c/Program Files/NASM:/c/ProgramData/chocolatey/bin:$PATH"
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter Windows arm64
        shell: bash
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          CC: aarch64-w64-mingw32-clang
          CXX: aarch64-w64-mingw32-clang++
          KOTV_JAVA_TOOLCHAIN: "21"
          KOTV_DCOMP_ENGINE_TAG: ${{ env.KOTV_DCOMP_ENGINE_TAG }}
          KOTV_DCOMP_ENGINE_VER: ${{ env.KOTV_DCOMP_ENGINE_VER }}
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/package-flutter-windows.sh windows-arm64

      - name: Build installer
        shell: pwsh
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          $ver = $env:TAG.TrimStart("v")
          choco install innosetup -y --no-progress
          ./scripts/make-win-installer.ps1 `
            -Plat windows-arm64 `
            -Tag $env:TAG `
            -Version $ver `
            -SourceDir "flutter\build\windows\arm64\runner\Release" `
            -ExeName kotv.exe
          Get-ChildItem "KO影视-${ver}-aarch64*" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: win-aarch64
          path: |
            KO影视-*-aarch64.zip
            KO影视-*-aarch64-setup.exe
          if-no-files-found: error

  # Flutter Win7 实验线：ZIP + Inno 安装包
  build-flutter-win7:
    runs-on: windows-2022
    needs: [set-tag, build-updater]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install go-legacy-win7
        shell: pwsh
        run: ./scripts/ci-install-go-legacy-win7.ps1

      - name: Install MSVCRT MinGW (Win7-safe CGO)
        shell: pwsh
        run: ./scripts/ci-install-mingw-msvcrt.ps1

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_WIN7_VERSION }}
          channel: stable
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-amd64
          path: cmd/updater

      - name: Install desktop MPV source deps (Win7)
        shell: bash
        run: |
          chmod +x scripts/ci-ensure-windows-mpv-host-deps.sh
          ./scripts/ci-ensure-windows-mpv-host-deps.sh

      - name: Adapt SDK + package Win7
        shell: bash
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          KOTV_WIN7: "1"
          KOTV_MPV_WIN7: "1"
          KOTV_OUT_SUFFIX: "-win7"
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_FETCH_DESKTOP_PLAT: windows
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
          CGO_CFLAGS: "-O2"
          CGO_CXXFLAGS: "-O2"
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -l:libwinpthread.a -Wl,-Bdynamic"
          KOTV_JAVA_TOOLCHAIN: "21"
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          export PATH="/c/Strawberry/perl/bin:/c/mingw-msvcrt/mingw64/bin:/c/Program Files/NASM:/c/ProgramData/chocolatey/bin:$PATH"
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))' 2>/dev/null):$PATH"
          ./scripts/adapt-flutter-win7-sdk.sh
          ./scripts/fetch-desktop-mpv-libs.sh
          ./scripts/package-flutter-windows.sh

      - name: Build Win7 installer
        shell: pwsh
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          $ver = $env:TAG.TrimStart("v")
          choco install innosetup -y --no-progress
          ./scripts/make-win-installer.ps1 `
            -Plat windows-x64 `
            -Tag $env:TAG `
            -Version $ver `
            -SourceDir "flutter\build\windows\x64\runner\Release" `
            -ExeName kotv.exe `
            -NameSuffix "-win7"
          Get-ChildItem "KO影视-${ver}-x86_64-win7*" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: win-x86_64-flutter-win7
          path: |
            KO影视-*-x86_64-win7.zip
            KO影视-*-x86_64-win7-setup.exe
          if-no-files-found: error

  build-linux-amd64:
    runs-on: ubuntu-latest
    needs: [set-tag, build-updater]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build meson pkg-config nasm yasm \
            libgtk-3-dev liblzma-dev libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libass-dev libarchive-dev libuchardet-dev librubberband-dev libdvbv5-dev \
            libbluray-dev libdvdread-dev libdvdnav-dev \
            liblua5.2-dev libluajit-5.1-dev \
            libplacebo-dev libvulkan-dev libshaderc-dev liblcms2-dev libxxhash-dev \
            libva-dev libdrm-dev libfontconfig1-dev \
            libssl-dev libcurl4-openssl-dev libnghttp2-dev \
            libasound2-dev libmpv-dev mpv \
            p7zip-full unzip curl zip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: updater-linux-amd64
          path: cmd/updater

      - name: Build desktop libmpv (Vulkan + AV3A source)
        env:
          KOTV_FETCH_DESKTOP_PLAT: linux
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter Linux
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          chmod +x cmd/updater/updater || true
          ./scripts/package-flutter-linux.sh linux-x64
          cp -f dist/KO影视-*-linux-x86_64.zip ./

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: linux-x86_64
          path: KO影视-*-linux-x86_64.zip
          if-no-files-found: error

  # Linux aarch64 桌面包（原生 arm runner）
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [set-tag, build-updater]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build meson pkg-config nasm yasm \
            libgtk-3-dev liblzma-dev libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libass-dev libarchive-dev libuchardet-dev librubberband-dev libdvbv5-dev \
            libbluray-dev libdvdread-dev libdvdnav-dev \
            liblua5.2-dev libluajit-5.1-dev \
            libplacebo-dev libvulkan-dev libshaderc-dev liblcms2-dev libxxhash-dev \
            libva-dev libdrm-dev libfontconfig1-dev \
            libssl-dev libcurl4-openssl-dev libnghttp2-dev \
            libasound2-dev libmpv-dev mpv \
            p7zip-full unzip curl zip git

      - name: Ensure Flutter
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
        run: |
          chmod +x scripts/ci-ensure-flutter.sh
          ./scripts/ci-ensure-flutter.sh

      - uses: actions/download-artifact@v4
        with:
          name: updater-linux-arm64
          path: cmd/updater

      - name: Build desktop libmpv (Vulkan + AV3A source)
        env:
          KOTV_FETCH_DESKTOP_PLAT: linux
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter Linux arm64
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          chmod +x cmd/updater/updater || true
          ./scripts/package-flutter-linux.sh linux-arm64
          cp -f dist/KO影视-*-linux-aarch64.zip ./

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: linux-aarch64
          path: KO影视-*-linux-aarch64.zip
          if-no-files-found: error

  build-mac-arm64:
    runs-on: macos-26
    needs: [set-tag, build-updater]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: updater-macos-arm64
          path: dist/updater-mac

      - name: Cache desktop runtime downloads
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-cache-macos-${{ hashFiles('scripts/prepare-runtime.sh', 'mpv-build.lock.json', 'scripts/patches/ffmpeg/**', 'scripts/patches/mpv-apple/**', 'scripts/build-desktop-mpv-from-source.sh', 'scripts/build-desktop-ffmpeg-av3a-prefix.sh', 'scripts/kotv-apply-patch-series.sh') }}
          restore-keys: |
            runtime-cache-macos-

      - name: Install desktop MPV source deps
        run: |
          brew install meson ninja pkg-config libass nasm molten-vk curl nghttp2

      - name: Build desktop libmpv (Vulkan + AV3A source)
        env:
          KOTV_FETCH_DESKTOP_PLAT: macos
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter macOS arm64
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          KOTV_MACOS_FORCE_ARCH: arm64
          GOARCH: arm64
          GOOS: darwin
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/package-flutter-macos.sh
          ver="${KOTV_VERSION#v}"
          cp -f "dist/KO影视-${ver}-aarch64.dmg" "./KO影视-${ver}-aarch64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: mac-aarch64
          path: KO影视-*-aarch64.dmg
          if-no-files-found: error

  build-mac-amd64:
    runs-on: macos-26
    needs: [set-tag, build-updater]
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"
          architecture: x64

      - uses: subosito/flutter-action@v2
        id: flutter_mac_amd64
        continue-on-error: true
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: x64

      # storage.googleapis.com 偶发 curl 56；失败再装一次
      - uses: subosito/flutter-action@v2
        if: steps.flutter_mac_amd64.outcome == 'failure'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: x64

      - uses: actions/download-artifact@v4
        with:
          name: updater-macos-amd64
          path: dist/updater-mac

      - name: Install desktop MPV source deps
        run: |
          brew install meson ninja pkg-config libass nasm molten-vk curl nghttp2

      - name: Build desktop libmpv x86_64 (Vulkan + AV3A source)
        env:
          KOTV_FETCH_DESKTOP_PLAT: macos
          KOTV_MPV_MACOS_ARCH: x86_64
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter macOS x86_64
        env:
          KOTV_MACOS_NO_FVP: "0"
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          KOTV_MACOS_FORCE_ARCH: x86_64
          GOARCH: amd64
          GOOS: darwin
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          # arm64 runner：Rosetta 下走完整 package 脚本（含 libmpv 校验和 DMG）
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 bash -lc '
              export PATH="/usr/local/bin:$PATH"
              export KOTV_MACOS_NO_FVP=0
              export KOTV_MACOS_FORCE_ARCH=x86_64
              export GOARCH=amd64
              export GOOS=darwin
              ./scripts/package-flutter-macos.sh
            '
          else
            ./scripts/package-flutter-macos.sh
          fi
          ver="${KOTV_VERSION#v}"
          cp -f "dist/KO影视-${ver}-x86_64.dmg" "./KO影视-${ver}-x86_64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: mac-x86_64
          path: KO影视-*-x86_64.dmg
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    needs: [set-tag]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # 镜像预装的 dotnet、模拟器和旧 NDK 占满磁盘后，Gradle 下载会失败。
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 默认 Python 3.10（且需本机同版本做 pip/pyc）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已下架旧 SDK `tools` 包；默认 packages 含 tools 会失败。
          packages: platform-tools

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
          add-to-path: false

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK (compileSdk 37.0)
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          sdkmanager --list_installed 2>/dev/null | grep -E 'platforms;android-3|build-tools' || true

      # 源码编 Android libmpv/FFmpeg 主机依赖（缺 gperf 会在 prepare 阶段直接失败）。
      - name: Install Android MPV host build deps
        run: |
          sudo apt-get update
          # fontconfig 2.18.3 要求 meson>=1.11；Ubuntu apt 仍是 1.10.x，改 pip。
          sudo apt-get install -y --no-install-recommends \
            gperf ninja-build nasm pkg-config wget \
            python3-pip python3-setuptools
          sudo pip3 install --upgrade 'meson>=1.11'
          command -v gperf
          command -v meson
          meson --version
          command -v ninja

      - name: Cache Android MPV native suite (jniLibs + Vulkan stub)
        uses: actions/cache@v4
        with:
          path: |
            flutter/android/app/src/main/assets/mpv-libs
            flutter/android/app/src/main/jniLibs/arm64-v8a
            flutter/android/app/src/main/jniLibs/armeabi-v7a
            .build/android-mpv-src
          key: android-mpv-native-${{ hashFiles('scripts/prepare-android-mpv-native.sh', 'scripts/build-android-mpv-from-source.sh', 'scripts/kotv-patch-mpv-android-buildscripts.sh', 'scripts/build-android-libvulkan-stub.sh', 'scripts/build-android-kotv-dl.sh', 'scripts/android-mpv-lib-names.sh', 'scripts/verify-android-mpv-libs.sh', 'flutter/android/native/vkcompat/vkcompat.c', 'flutter/android/native/kotv_dl/kotv_dl.c') }}
          restore-keys: |
            android-mpv-native-

      - name: Cache Android Node launcher + nodejs-mobile
        uses: actions/cache@v4
        with:
          path: |
            .runtime-cache/android-node
            flutter/android/app/src/main/jniLibs/*/libkotv_node.so
          key: android-node-v18.20.4-${{ hashFiles('scripts/build-android-node-launcher.sh', 'scripts/android-node/kotv_node_main.cpp') }}
          restore-keys: |
            android-node-v18.20.4-

      - name: Cache Media3 maven + checkout
        uses: actions/cache@v4
        with:
          path: |
            flutter/android/third_party/maven-webhtv
            .tmp/fongmi-media
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fongmi-media3-1.11.0-alpha01-${{ runner.os }}-${{ hashFiles('scripts/build-fongmi-media3.sh', 'scripts/fetch-android-exo-av3a.sh') }}
          restore-keys: |
            fongmi-media3-1.11.0-alpha01-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Package Android APKs
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          KOTV_JAVA_TOOLCHAIN: "17"
          KOTV_TARGET_SDK: "28"
          CHAQUOPY_BUILD_PYTHON: python3.10
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/*.sh
          python3.10 --version
          test -f flutter/android/app/libs/thunder-release.aar
          ./scripts/package-flutter-android.sh
          ./scripts/verify-android-mpv-apk.sh dist/KO影视-*-aarch64.apk
          ls -lh dist/KO影视-*.apk

      # Upload 只需 dist/*.apk；清中间产物降盘压，避免 runner 在 archive 阶段失联。
      - name: Free disk before Android upload
        run: |
          df -h /
          du -sh dist flutter/build .tmp/fongmi-media ~/.gradle 2>/dev/null || true
          rm -rf flutter/build .tmp/fongmi-media
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          compression-level: 0
          name: android-aarch64
          path: dist/KO影视-*-aarch64.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          compression-level: 0
          name: android-armv7
          path: dist/KO影视-*-armv7.apk
          if-no-files-found: error

  # Web 便携包 = musl 静态引擎 + 预编译 runtime + webapp（非群晖）
  build-web:
    runs-on: ubuntu-latest
    needs: [set-tag]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build meson pkg-config nasm yasm \
            libgtk-3-dev liblzma-dev libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libass-dev libarchive-dev libuchardet-dev librubberband-dev libdvbv5-dev \
            libbluray-dev libdvdread-dev libdvdnav-dev \
            liblua5.2-dev libluajit-5.1-dev \
            p7zip-full unzip curl zip docker.io

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Package Web (engine + webapp)
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
        run: |
          flutter config --enable-web
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/package-flutter-web.sh linux-x64
          file dist/KOTV-web-linux-x64/kotv-engine
          if ldd dist/KOTV-web-linux-x64/kotv-engine >/dev/null 2>&1; then
            echo "engine still dynamically linked:" >&2
            ldd dist/KOTV-web-linux-x64/kotv-engine >&2
            exit 1
          fi
          ls -lh dist/KO影视-*-web-*.zip

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: flutter-web
          path: |
            dist/KO影视-*-web-linux-x86_64.zip
            dist/KO影视-*-web-static.zip
          if-no-files-found: error

  # 群晖：按「组件 × 架构」分 job 编译，全部完成后 synology-package 合并打 SPK
  synology-piece:
    runs-on: ubuntu-latest
    needs: [set-tag]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # —— runtime × arch ——
          - { kind: runtime, toolkit_plat: geminilake, arch_label: x86_64, piece: node,     artifact: syno-node-x86_64,     timeout_minutes: 180 }
          - { kind: runtime, toolkit_plat: geminilake, arch_label: x86_64, piece: python,   artifact: syno-python-x86_64,   timeout_minutes: 180 }
          - { kind: runtime, toolkit_plat: geminilake, arch_label: x86_64, piece: jre,      artifact: syno-jre-x86_64,      timeout_minutes: 360 }
          - { kind: runtime, toolkit_plat: geminilake, arch_label: x86_64, piece: chromium, artifact: syno-chromium-x86_64, timeout_minutes: 600 }
          - { kind: runtime, toolkit_plat: geminilake, arch_label: x86_64, piece: ffmpeg,   artifact: syno-ffmpeg-x86_64,   timeout_minutes: 120 }
          - { kind: runtime, toolkit_plat: rtd1296,    arch_label: armv8,  piece: node,     artifact: syno-node-armv8,     timeout_minutes: 180 }
          - { kind: runtime, toolkit_plat: rtd1296,    arch_label: armv8,  piece: python,   artifact: syno-python-armv8,   timeout_minutes: 180 }
          - { kind: runtime, toolkit_plat: rtd1296,    arch_label: armv8,  piece: jre,      artifact: syno-jre-armv8,      timeout_minutes: 360 }
          - { kind: runtime, toolkit_plat: rtd1296,    arch_label: armv8,  piece: chromium, artifact: syno-chromium-armv8, timeout_minutes: 600 }
          - { kind: runtime, toolkit_plat: rtd1296,    arch_label: armv8,  piece: ffmpeg,   artifact: syno-ffmpeg-armv8,   timeout_minutes: 120 }
          # —— engine × arch ——
          - { kind: engine, toolkit_plat: geminilake, arch_label: x86_64, piece: engine, artifact: syno-engine-x86_64, timeout_minutes: 60 }
          - { kind: engine, toolkit_plat: rtd1296,    arch_label: armv8,  piece: engine, artifact: syno-engine-armv8,  timeout_minutes: 60 }
          # —— 与架构无关 ——
          - { kind: webapp, toolkit_plat: "", arch_label: any, piece: webapp, artifact: syno-webapp-any, timeout_minutes: 60 }
          - { kind: bridge, toolkit_plat: "", arch_label: any, piece: bridge, artifact: syno-bridge-any, timeout_minutes: 30 }
    name: synology ${{ matrix.piece }} (${{ matrix.arch_label }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.kind == 'engine'
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      - uses: actions/setup-java@v4
        if: matrix.kind == 'bridge' || matrix.piece == 'jre'
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        if: matrix.kind == 'webapp'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build deps
        if: matrix.kind != 'webapp' && matrix.kind != 'bridge'
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip xz-utils cifs-utils \
            build-essential clang lld ninja-build meson nasm pkg-config curl ca-certificates \
            autoconf automake libtool cmake unzip zip rsync docker.io \
            gperf bison flex gettext
          sudo systemctl start docker || sudo service docker start || true
          sudo usermod -aG docker "$USER" || true
          sudo chmod 666 /var/run/docker.sock || true
          docker version

      - name: Cache Synology toolkit + sources
        if: matrix.kind == 'runtime' || matrix.kind == 'engine'
        uses: actions/cache@v4
        with:
          path: |
            .toolkit/pkgscripts-ng
            .toolkit/toolkit_tarballs
            .toolkit/build_env
            .syno-src-cache
            .syno-deps
          key: syno-toolkit-7.2-${{ matrix.toolkit_plat }}-${{ hashFiles('scripts/synology/versions.env', 'scripts/synology/toolkit-deps.sh') }}-v9
          restore-keys: |
            syno-toolkit-7.2-${{ matrix.toolkit_plat }}-
            syno-toolkit-7.2-

      - name: Build piece
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          KOTV_TOOLKIT_ROOT: ${{ github.workspace }}/.toolkit
          KOTV_SYNO_SRC_CACHE: ${{ github.workspace }}/.syno-src-cache
          KOTV_SYNO_BUILD_ROOT: ${{ github.workspace }}/.syno-build/${{ matrix.toolkit_plat }}-${{ matrix.piece }}
          KOTV_SYNO_DOCKER_DEPLOY: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
        run: |
          chmod +x bridge/build.sh scripts/*.sh scripts/synology/*.sh
          case "${{ matrix.kind }}" in
            runtime)
              ./scripts/synology/ci-build-piece.sh runtime "${{ matrix.toolkit_plat }}" "${{ matrix.piece }}"
              ;;
            engine)
              # Toolkit GCC+sysroot 全静态（CGO 依赖也走工具链）
              ./scripts/synology/ci-build-piece.sh engine "${{ matrix.toolkit_plat }}"
              ;;
            webapp)
              flutter config --enable-web
              ./scripts/synology/ci-build-piece.sh webapp
              ;;
            bridge)
              ./scripts/synology/ci-build-piece.sh bridge
              ;;
            *)
              echo "unknown kind ${{ matrix.kind }}" >&2
              exit 1
              ;;
          esac
          ls -lh dist/syno-pieces/
          rm -rf .syno-build/${{ matrix.toolkit_plat }}-${{ matrix.piece }} || true

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: ${{ matrix.artifact }}
          path: dist/syno-pieces/${{ matrix.artifact }}.tar
          if-no-files-found: error

  synology-package:
    runs-on: ubuntu-latest
    needs: [set-tag, synology-piece]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: syno-*
          path: dist/syno-pieces-dl
          merge-multiple: false

      - name: Assemble SPKs
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
        run: |
          chmod +x scripts/synology/*.sh
          # download-artifact 每个 artifact 一个子目录，内含 .tar
          mkdir -p dist/syno-pieces
          find dist/syno-pieces-dl -type f -name 'syno-*.tar' -exec cp -f {} dist/syno-pieces/ \;
          ls -lh dist/syno-pieces/
          ./scripts/synology/ci-assemble-spks.sh dist/syno-pieces
          ls -lh dist/KO影视-*-synology-*.spk
          # shellcheck source=scripts/synology/common.sh
          source scripts/synology/common.sh
          for arch in x86_64 armv8; do
            eng="dist/syno-engine-${arch}/kotv-engine"
            file "$eng"
            kotv_syno_assert_static_engine "$eng"
          done

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: synology-spk-x86_64
          path: dist/KO影视-*-synology-x86_64.spk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: synology-spk-armv8
          path: dist/KO影视-*-synology-armv8.spk
          if-no-files-found: error

  build-ios:
    runs-on: macos-26
    needs: [set-tag]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Package unsigned IPA
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/package-flutter-ios.sh

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: ios
          path: KO影视-*-ios.ipa
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - set-tag
      - build-updater
      - build-win-amd64
      - build-win-arm64
      - build-flutter-win7
      - build-linux-amd64
      - build-linux-arm64
      - build-mac-arm64
      - build-mac-amd64
      - build-android
      - build-web
      - synology-package
      - build-ios
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Organize release files
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          mkdir -p ./release-files
          find . -maxdepth 4 -type f \( \
            -name 'KO影视-*.zip' -o \
            -name 'KO影视-*.dmg' -o \
            -name 'KO影视-*-setup.exe' -o \
            -name 'KO影视-*.apk' -o \
            -name 'KO影视-*.ipa' -o \
            -name 'KO影视-*.spk' \
          \) -print -exec cp -f {} ./release-files/ \;
          for spec in \
            "updater-linux-amd64/updater:updater-linux-amd64" \
            "updater-linux-arm64/updater:updater-linux-arm64" \
            "updater-windows-amd64/updater.exe:updater-windows-amd64.exe" \
            "updater-windows-arm64/updater.exe:updater-windows-arm64.exe" \
            "updater-macos-amd64/updater:updater-macos-amd64" \
            "updater-macos-arm64/updater:updater-macos-arm64"; do
            src="${spec%%:*}"
            dst="${spec##*:}"
            found="$(find . -path "*/${src}" -print -quit)"
            if [[ -n "$found" ]]; then
              cp "$found" "./release-files/$dst"
            fi
          done
          ls -la ./release-files/

      - name: Generate version.json
        env:
          VERSION: ${{ needs.set-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{version}"
          ver = version.lstrip("v")
          data = {
            "version": ver,
            "notes": f"KO影视 {version}",
            "downloads": {
              "windows-amd64": f"{base}/KO影视-{ver}-x86_64.zip",
              "windows-amd64-setup": f"{base}/KO影视-{ver}-x86_64-setup.exe",
              "windows-arm64": f"{base}/KO影视-{ver}-aarch64.zip",
              "windows-arm64-setup": f"{base}/KO影视-{ver}-aarch64-setup.exe",
              "windows-amd64-flutter-win7": f"{base}/KO影视-{ver}-x86_64-win7.zip",
              "windows-amd64-flutter-win7-setup": f"{base}/KO影视-{ver}-x86_64-win7-setup.exe",
              "linux-amd64": f"{base}/KO影视-{ver}-linux-x86_64.zip",
              "linux-arm64": f"{base}/KO影视-{ver}-linux-aarch64.zip",
              "darwin-arm64": f"{base}/KO影视-{ver}-aarch64.dmg",
              "darwin-amd64": f"{base}/KO影视-{ver}-x86_64.dmg",
              "android-arm64": f"{base}/KO影视-{ver}-aarch64.apk",
              "android-armv7": f"{base}/KO影视-{ver}-armv7.apk",
              "web-linux-amd64": f"{base}/KO影视-{ver}-web-linux-x86_64.zip",
              "web-static": f"{base}/KO影视-{ver}-web-static.zip",
              "synology-x86_64": f"{base}/KO影视-{ver}-synology-x86_64.spk",
              "synology-armv8": f"{base}/KO影视-{ver}-synology-armv8.spk",
              "ios": f"{base}/KO影视-{ver}-ios.ipa",
            },
          }
          open("./release-files/version.json", "w").write(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Write release notes
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          ver="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          CHANGELOG=$(awk -v version="$TAG" '
            BEGIN { found=0; content="" }
            /^## / {
              if (found) exit
              if ($2 == version) { found=1; next }
            }
            found && /^## / { exit }
            found {
              if (content != "") content = content "\n"
              content = content $0
            }
            END { print content }
          ' CHANGELOG.md 2>/dev/null || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(printf -- "- 发布新版本 %s\n- 详细更新内容请查看 CHANGELOG.md" "$TAG")
          fi
          {
            echo "## KO影视 ${TAG}"
            echo
            echo "### 更新日志"
            echo
            echo "${CHANGELOG}"
            echo
            echo "---"
            echo
            echo "### 下载（Flutter UI + Go 引擎）"
            echo
            echo "| 平台 | 文件 |"
            echo "|------|------|"
            echo "| Windows x86_64 | [安装包](${base}/KO影视-${ver}-x86_64-setup.exe) · [ZIP](${base}/KO影视-${ver}-x86_64.zip) |"
            echo "| Windows aarch64 | [安装包](${base}/KO影视-${ver}-aarch64-setup.exe) · [ZIP](${base}/KO影视-${ver}-aarch64.zip) |"
            echo "| Windows x86_64 Win7 | [安装包](${base}/KO影视-${ver}-x86_64-win7-setup.exe) · [ZIP](${base}/KO影视-${ver}-x86_64-win7.zip) |"
            echo "| Linux x86_64 | [ZIP](${base}/KO影视-${ver}-linux-x86_64.zip) |"
            echo "| Linux aarch64 | [ZIP](${base}/KO影视-${ver}-linux-aarch64.zip) |"
            echo "| macOS aarch64 | [DMG](${base}/KO影视-${ver}-aarch64.dmg) |"
            echo "| macOS x86_64 | [DMG](${base}/KO影视-${ver}-x86_64.dmg) |"
            echo "| Android aarch64 | [APK](${base}/KO影视-${ver}-aarch64.apk) |"
            echo "| Android armv7 | [APK](${base}/KO影视-${ver}-armv7.apk) |"
            echo "| **Web 包**（引擎同端口） | [引擎+Web](${base}/KO影视-${ver}-web-linux-x86_64.zip) · [仅 webapp](${base}/KO影视-${ver}-web-static.zip) |"
            echo "| **群晖 DSM 7.2 SPK**（Toolkit 静态引擎 + 运行时） | [x86_64](${base}/KO影视-${ver}-synology-x86_64.spk) · [armv8](${base}/KO影视-${ver}-synology-armv8.spk) |"
            echo "| iOS（未签名） | [IPA](${base}/KO影视-${ver}-ios.ipa) |"
          } > ./RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-files/*
          tag_name: ${{ needs.set-tag.outputs.tag }}
          name: "KO影视 ${{ needs.set-tag.outputs.tag }}"
          body_path: ./RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.set-tag.outputs.tag, 'alpha') }}
