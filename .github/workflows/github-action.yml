# Flutter UI + Go 引擎：全平台打包（含 Windows 安装包 / Win7 / Android）→ GitHub Release
name: KOTV Build
on:
  workflow_dispatch:
  push:
    branches: [main, master, restore-sidecar]
    tags: ["v*"]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # 非 Win7：跟 stable 最新；Win7 钉官方末版 3.19.6
  FLUTTER_VERSION: "3.44.8"
  FLUTTER_WIN7_VERSION: "3.19.6"

jobs:
  set-tag:
    uses: ./.github/workflows/set-tag-workflow.yml

  build-updater:
    uses: ./.github/workflows/build-updater.yml
    with:
      release_tag: ${{ needs.set-tag.outputs.tag }}
    needs: [set-tag]

  # Win10+ Flutter x86_64：ZIP + Inno 安装包
  build-win-amd64:
    runs-on: windows-2022
    needs: [set-tag, build-updater]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install go-legacy-win7
        shell: pwsh
        run: |
          $ver = "1.26.5-1"
          $zip = "go-legacy-win7-$ver.windows_amd64.zip"
          $url = "https://github.com/thongtech/go-legacy-win7/releases/download/v$ver/$zip"
          curl.exe -sSL -o "$env:RUNNER_TEMP\$zip" $url
          Expand-Archive -Path "$env:RUNNER_TEMP\$zip" -DestinationPath "C:\" -Force
          echo "GOROOT=C:\go-legacy-win7" >> $env:GITHUB_ENV
          echo "C:\go-legacy-win7\bin" >> $env:GITHUB_PATH
          & "C:\go-legacy-win7\bin\go.exe" version

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Install MSVCRT MinGW (Win7-safe CGO)
        shell: pwsh
        run: |
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/15.2.0-rt_v13-rev1/x86_64-15.2.0-release-win32-seh-msvcrt-rt_v13-rev1.7z"
          curl.exe -sSL -o "$env:RUNNER_TEMP\mingw.7z" $url
          7z x "$env:RUNNER_TEMP\mingw.7z" -o"C:\mingw-msvcrt" | Out-Null
          Get-ChildItem -Path "C:\mingw-msvcrt" -Recurse -Filter "libwinpthread.dll.a" -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Force $_.FullName }
          Get-ChildItem -Path "C:\mingw-msvcrt" -Recurse -Filter "libpthread.dll.a" -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Force $_.FullName }
          echo "C:\mingw-msvcrt\mingw64\bin" >> $env:GITHUB_PATH
          & "C:\mingw-msvcrt\mingw64\bin\gcc.exe" --version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-amd64
          path: cmd/updater

      - name: Install desktop MPV source deps
        shell: bash
        run: |
          choco install nasm vulkan-sdk -y --no-progress
          python -m pip install meson ninja
          export PATH="/c/mingw-msvcrt/mingw64/bin:/c/Program Files/NASM:/c/ProgramData/chocolatey/bin:$PATH"
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
          gcc --version
          nasm -v
          meson --version
          if [[ -z "${VULKAN_SDK:-}" ]]; then
            sdk="$(ls -d /c/VulkanSDK/*/ 2>/dev/null | tail -1 || true)"
            [[ -n "$sdk" ]] && echo "VULKAN_SDK=$(cygpath -w "$sdk")" >> "$GITHUB_ENV"
          fi

      - name: Build desktop libmpv (Vulkan + AV3A source)
        shell: bash
        env:
          KOTV_FETCH_DESKTOP_PLAT: windows
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          export PATH="/c/mingw-msvcrt/mingw64/bin:/c/Program Files/NASM:/c/ProgramData/chocolatey/bin:$PATH"
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter Windows
        shell: bash
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
          CGO_CFLAGS: "-O2"
          CGO_CXXFLAGS: "-O2"
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -l:libwinpthread.a -Wl,-Bdynamic"
          KOTV_JAVA_TOOLCHAIN: "21"
          # windows-2022 / 新 Flutter：强制 VS2022，避免落到缺失的 VS2019
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/package-flutter-windows.sh

      - name: Build installer
        shell: pwsh
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          $ver = $env:TAG.TrimStart("v")
          choco install innosetup -y --no-progress
          ./scripts/make-win-installer.ps1 `
            -Plat windows-x64 `
            -Tag $env:TAG `
            -Version $ver `
            -SourceDir "flutter\build\windows\x64\runner\Release" `
            -ExeName kotv.exe
          Get-ChildItem "KO影视-${ver}-x86_64*" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: win-x86_64
          path: |
            KO影视-*-x86_64.zip
            KO影视-*-x86_64-setup.exe
          if-no-files-found: error

  # Flutter Win7 实验线：ZIP + Inno 安装包
  build-flutter-win7:
    runs-on: windows-2022
    needs: [set-tag, build-updater]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install go-legacy-win7
        shell: pwsh
        run: |
          $ver = "1.26.5-1"
          $zip = "go-legacy-win7-$ver.windows_amd64.zip"
          $url = "https://github.com/thongtech/go-legacy-win7/releases/download/v$ver/$zip"
          curl.exe -sSL -o "$env:RUNNER_TEMP\$zip" $url
          Expand-Archive -Path "$env:RUNNER_TEMP\$zip" -DestinationPath "C:\" -Force
          echo "GOROOT=C:\go-legacy-win7" >> $env:GITHUB_ENV
          echo "C:\go-legacy-win7\bin" >> $env:GITHUB_PATH
          & "C:\go-legacy-win7\bin\go.exe" version

      - name: Install MSVCRT MinGW (Win7-safe CGO)
        shell: pwsh
        run: |
          $url = "https://github.com/niXman/mingw-builds-binaries/releases/download/15.2.0-rt_v13-rev1/x86_64-15.2.0-release-win32-seh-msvcrt-rt_v13-rev1.7z"
          curl.exe -sSL -o "$env:RUNNER_TEMP\mingw.7z" $url
          7z x "$env:RUNNER_TEMP\mingw.7z" -o"C:\mingw-msvcrt" | Out-Null
          Get-ChildItem -Path "C:\mingw-msvcrt" -Recurse -Filter "libwinpthread.dll.a" -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Force $_.FullName }
          Get-ChildItem -Path "C:\mingw-msvcrt" -Recurse -Filter "libpthread.dll.a" -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Force $_.FullName }
          echo "C:\mingw-msvcrt\mingw64\bin" >> $env:GITHUB_PATH
          & "C:\mingw-msvcrt\mingw64\bin\gcc.exe" --version

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_WIN7_VERSION }}
          channel: stable
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-amd64
          path: cmd/updater

      - name: Install desktop MPV source deps (Win7)
        shell: bash
        run: |
          choco install nasm vulkan-sdk -y --no-progress
          python -m pip install meson ninja
          export PATH="/c/mingw-msvcrt/mingw64/bin:/c/Program Files/NASM:/c/ProgramData/chocolatey/bin:$PATH"
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
          gcc --version
          nasm -v
          meson --version
          if [[ -z "${VULKAN_SDK:-}" ]]; then
            sdk="$(ls -d /c/VulkanSDK/*/ 2>/dev/null | tail -1 || true)"
            [[ -n "$sdk" ]] && echo "VULKAN_SDK=$(cygpath -w "$sdk")" >> "$GITHUB_ENV"
          fi

      - name: Adapt SDK + package Win7
        shell: bash
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          KOTV_WIN7: "1"
          KOTV_MPV_WIN7: "1"
          KOTV_OUT_SUFFIX: "-win7"
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_FETCH_DESKTOP_PLAT: windows
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
          CGO_CFLAGS: "-O2"
          CGO_CXXFLAGS: "-O2"
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -l:libwinpthread.a -Wl,-Bdynamic"
          KOTV_JAVA_TOOLCHAIN: "21"
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/adapt-flutter-win7-sdk.sh
          ./scripts/fetch-desktop-mpv-libs.sh
          ./scripts/package-flutter-windows.sh

      - name: Build Win7 installer
        shell: pwsh
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          $ver = $env:TAG.TrimStart("v")
          choco install innosetup -y --no-progress
          ./scripts/make-win-installer.ps1 `
            -Plat windows-x64 `
            -Tag $env:TAG `
            -Version $ver `
            -SourceDir "flutter\build\windows\x64\runner\Release" `
            -ExeName kotv.exe `
            -NameSuffix "-win7"
          Get-ChildItem "KO影视-${ver}-x86_64-win7*" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: win-x86_64-flutter-win7
          path: |
            KO影视-*-x86_64-win7.zip
            KO影视-*-x86_64-win7-setup.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    needs: [set-tag, build-updater]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build meson pkg-config nasm yasm \
            libgtk-3-dev liblzma-dev libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libass-dev libarchive-dev libbluray-dev liblua5.2-dev libluajit-5.1-dev \
            libplacebo-dev libvulkan-dev libshaderc-dev liblcms2-dev \
            libssl-dev libcurl4-openssl-dev \
            libasound2-dev libmpv-dev mpv \
            p7zip-full unzip curl zip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: updater-linux-amd64
          path: cmd/updater

      - name: Build desktop libmpv (Vulkan + AV3A source)
        env:
          KOTV_FETCH_DESKTOP_PLAT: linux
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter Linux
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          chmod +x cmd/updater/updater || true
          ./scripts/package-flutter-linux.sh
          cp -f dist/KO影视-*-linux-x86_64.zip ./

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: KO影视-*-linux-x86_64.zip
          if-no-files-found: error

  build-mac-arm64:
    runs-on: macos-14
    needs: [set-tag, build-updater]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: updater-macos-arm64
          path: dist/updater-mac

      - name: Install desktop MPV source deps
        run: |
          brew install meson ninja pkg-config libass nasm molten-vk curl

      - name: Build desktop libmpv (Vulkan + AV3A source)
        env:
          KOTV_FETCH_DESKTOP_PLAT: macos
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter macOS arm64
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          KOTV_MACOS_FORCE_ARCH: arm64
          GOARCH: arm64
          GOOS: darwin
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/package-flutter-macos.sh
          ver="${KOTV_VERSION#v}"
          if [[ -f dist/updater-mac/updater && -d "dist/KO影视.app" ]]; then
            cp -f dist/updater-mac/updater "dist/KO影视.app/Contents/MacOS/updater"
            chmod +x "dist/KO影视.app/Contents/MacOS/updater"
          fi
          cp -f "dist/KO影视-${ver}-aarch64.dmg" "./KO影视-${ver}-aarch64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-aarch64
          path: KO影视-*-aarch64.dmg
          if-no-files-found: error

  build-mac-amd64:
    runs-on: macos-14
    needs: [set-tag, build-updater]
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"
          architecture: x64

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: x64

      - uses: actions/download-artifact@v4
        with:
          name: updater-macos-amd64
          path: dist/updater-mac

      - name: Install desktop MPV source deps
        run: |
          brew install meson ninja pkg-config libass nasm molten-vk curl

      - name: Build desktop libmpv x86_64 (Vulkan + AV3A source)
        env:
          KOTV_FETCH_DESKTOP_PLAT: macos
          KOTV_MPV_MACOS_ARCH: x86_64
          KOTV_BUILD_MPV_AV3A: "1"
          KOTV_MPV_JOBS: "4"
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-desktop-mpv-libs.sh

      - name: Package Flutter macOS x86_64
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          KOTV_MACOS_NO_FVP: "0"
          KOTV_MACOS_FORCE_ARCH: x86_64
          GOARCH: amd64
          GOOS: darwin
        run: |
          chmod +x bridge/build.sh scripts/*.sh
          # arm64 runner：Rosetta 下走完整 package 脚本（含 libmpv 校验 / kotv-launch / DMG）
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 bash -lc '
              export PATH="/usr/local/bin:$PATH"
              export KOTV_MACOS_NO_FVP=0
              export KOTV_MACOS_FORCE_ARCH=x86_64
              export GOARCH=amd64
              export GOOS=darwin
              ./scripts/package-flutter-macos.sh
            '
          else
            ./scripts/package-flutter-macos.sh
          fi
          ver="${KOTV_VERSION#v}"
          if [[ -f dist/updater-mac/updater && -d "dist/KO影视.app" ]]; then
            cp -f dist/updater-mac/updater "dist/KO影视.app/Contents/MacOS/updater"
            chmod +x "dist/KO影视.app/Contents/MacOS/updater"
          fi
          cp -f "dist/KO影视-${ver}-x86_64.dmg" "./KO影视-${ver}-x86_64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-x86_64
          path: KO影视-*-x86_64.dmg
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    needs: [set-tag]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 默认 Python 3.10（且需本机同版本做 pip/pyc）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
          add-to-path: false

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android build tools (patchelf for libmpv DT_NEEDED)
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Package Android APKs
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          KOTV_JAVA_TOOLCHAIN: "17"
          KOTV_TARGET_SDK: "28"
          CHAQUOPY_BUILD_PYTHON: python3.10
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/*.sh
          python3.10 --version
          test -f flutter/android/app/libs/thunder-release.aar
          ./scripts/package-flutter-android.sh
          ./scripts/verify-android-mpv-apk.sh dist/KO影视-*-aarch64.apk
          ls -lh dist/KO影视-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/KO影视-*-aarch64.apk
            dist/KO影视-*-armv7.apk
          if-no-files-found: error

  # Web 包 = 引擎 + webapp（同端口放出，不进 PC/安卓/iOS）
  build-web:
    runs-on: ubuntu-latest
    needs: [set-tag]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build meson pkg-config nasm yasm \
            libgtk-3-dev liblzma-dev libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libass-dev libarchive-dev libbluray-dev liblua5.2-dev libluajit-5.1-dev \
            p7zip-full unzip curl zip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Package Web (engine + webapp)
        env:
          KOTV_VERSION: ${{ needs.set-tag.outputs.tag }}
          CGO_ENABLED: "1"
          KOTV_JAVA_TOOLCHAIN: "21"
        run: |
          flutter config --enable-web
          chmod +x bridge/build.sh scripts/*.sh
          ./scripts/package-flutter-web.sh linux-x64
          # 确认引擎摆脱宿主 glibc
          file dist/KOTV-web-linux-x64/kotv-engine
          if ldd dist/KOTV-web-linux-x64/kotv-engine >/dev/null 2>&1; then
            echo "engine still dynamically linked:" >&2
            ldd dist/KOTV-web-linux-x64/kotv-engine >&2
            exit 1
          fi
          ls -lh dist/KO影视-*-web-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: |
            dist/KO影视-*-web-linux-x86_64.zip
            dist/KO影视-*-web-static.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - set-tag
      - build-updater
      - build-win-amd64
      - build-flutter-win7
      - build-linux
      - build-mac-arm64
      - build-mac-amd64
      - build-android
      - build-web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Organize release files
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          mkdir -p ./release-files
          find . -maxdepth 3 -type f \( \
            -name 'KO影视-*.zip' -o \
            -name 'KO影视-*.dmg' -o \
            -name 'KO影视-*-setup.exe' -o \
            -name 'KO影视-*.apk' \
          \) -print -exec cp -f {} ./release-files/ \;
          for spec in \
            "updater-linux-amd64/updater:updater-linux-amd64" \
            "updater-windows-amd64/updater.exe:updater-windows-amd64.exe" \
            "updater-windows-arm64/updater.exe:updater-windows-arm64.exe" \
            "updater-macos-amd64/updater:updater-macos-amd64" \
            "updater-macos-arm64/updater:updater-macos-arm64"; do
            src="${spec%%:*}"
            dst="${spec##*:}"
            found="$(find . -path "*/${src}" -print -quit)"
            if [[ -n "$found" ]]; then
              cp "$found" "./release-files/$dst"
            fi
          done
          ls -la ./release-files/

      - name: Generate version.json
        env:
          VERSION: ${{ needs.set-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{version}"
          ver = version.lstrip("v")
          data = {
            "version": ver,
            "notes": f"KO影视 {version}",
            "downloads": {
              "windows-amd64": f"{base}/KO影视-{ver}-x86_64.zip",
              "windows-amd64-setup": f"{base}/KO影视-{ver}-x86_64-setup.exe",
              "windows-amd64-flutter-win7": f"{base}/KO影视-{ver}-x86_64-win7.zip",
              "windows-amd64-flutter-win7-setup": f"{base}/KO影视-{ver}-x86_64-win7-setup.exe",
              "linux-amd64": f"{base}/KO影视-{ver}-linux-x86_64.zip",
              "darwin-arm64": f"{base}/KO影视-{ver}-aarch64.dmg",
              "darwin-amd64": f"{base}/KO影视-{ver}-x86_64.dmg",
              "android-arm64": f"{base}/KO影视-{ver}-aarch64.apk",
              "android-armv7": f"{base}/KO影视-{ver}-armv7.apk",
              "web-linux-amd64": f"{base}/KO影视-{ver}-web-linux-x86_64.zip",
              "web-static": f"{base}/KO影视-{ver}-web-static.zip",
            },
          }
          open("./release-files/version.json", "w").write(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Write release notes
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          ver="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          CHANGELOG=$(awk -v version="$TAG" '
            BEGIN { found=0; content="" }
            /^## / {
              if (found) exit
              if ($2 == version) { found=1; next }
            }
            found && /^## / { exit }
            found {
              if (content != "") content = content "\n"
              content = content $0
            }
            END { print content }
          ' CHANGELOG.md 2>/dev/null || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(printf -- "- 发布新版本 %s\n- 详细更新内容请查看 CHANGELOG.md" "$TAG")
          fi
          {
            echo "## KO影视 ${TAG}"
            echo
            echo "### 更新日志"
            echo
            echo "${CHANGELOG}"
            echo
            echo "---"
            echo
            echo "### 下载（Flutter UI + Go 引擎）"
            echo
            echo "| 平台 | 文件 |"
            echo "|------|------|"
            echo "| Windows x86_64 | [安装包](${base}/KO影视-${ver}-x86_64-setup.exe) · [ZIP](${base}/KO影视-${ver}-x86_64.zip) |"
            echo "| Windows x86_64 Win7 | [安装包](${base}/KO影视-${ver}-x86_64-win7-setup.exe) · [ZIP](${base}/KO影视-${ver}-x86_64-win7.zip) |"
            echo "| Linux x86_64 | [ZIP](${base}/KO影视-${ver}-linux-x86_64.zip) |"
            echo "| macOS aarch64 | [DMG](${base}/KO影视-${ver}-aarch64.dmg) |"
            echo "| macOS x86_64 | [DMG](${base}/KO影视-${ver}-x86_64.dmg) |"
            echo "| Android aarch64 | [APK](${base}/KO影视-${ver}-aarch64.apk) |"
            echo "| Android armv7 | [APK](${base}/KO影视-${ver}-armv7.apk) |"
            echo "| **Web 包**（引擎同端口） | [引擎+Web](${base}/KO影视-${ver}-web-linux-x86_64.zip) · [仅 webapp](${base}/KO影视-${ver}-web-static.zip) |"
          } > ./RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-files/*
          tag_name: ${{ needs.set-tag.outputs.tag }}
          name: "KO影视 ${{ needs.set-tag.outputs.tag }}"
          body_path: ./RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.set-tag.outputs.tag, 'alpha') }}
