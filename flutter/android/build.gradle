allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url uri("${rootProject.projectDir}/third_party/maven-webhtv") }
    }
}

// okhttp-android 5.5.0 的 AAR 声明 minCompileSdk=37。工程 compileSdk 仍是 36，targetSdk 仍是 28。
// 选同一版本的 JVM 构件，播放和爬虫仍是 OkHttp 5.5.0，打包不再被这条元数据拦住。
subprojects { sub ->
    sub.configurations.configureEach { cfg ->
        cfg.resolutionStrategy.dependencySubstitution {
            substitute(module("com.squareup.okhttp3:okhttp-android"))
                .using(module("com.squareup.okhttp3:okhttp-jvm:5.5.0"))
                .because("okhttp-android 5.5.0 要求 compileSdk 37")
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { sub ->
    // kotv-bridge 是 app 的依赖，不能 evaluationDependsOn app（会循环）
    if (sub.name != "app" && sub.name != "kotv-bridge") {
        sub.evaluationDependsOn(":app")
    }
}

// AGP 8+：旧插件缺 namespace 时从 Manifest package 回填。
// 与 scripts/patch-android-plugin-namespaces.sh 双保险。
// 同时统一 NDK：避免子工程（如 fvp）回落到 AGP 默认 NDK 并触发易损坏的自动下载。
subprojects { sub ->
    sub.pluginManager.withPlugin("com.android.library") {
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null && (androidExt.namespace == null || androidExt.namespace.toString().trim().isEmpty())) {
            def manifest = sub.file("src/main/AndroidManifest.xml")
            def ns = null
            if (manifest.exists()) {
                def m = (manifest.getText("UTF-8") =~ /package\s*=\s*"([^"]+)"/)
                if (m.find()) ns = m.group(1)
            }
            androidExt.namespace = ns ?: "com.legacy.${sub.name.replace('-', '_')}"
            println "[android] namespace fallback for :${sub.name} -> ${androidExt.namespace}"
        }
        if (androidExt != null) {
            try {
                androidExt.ndkVersion = "28.2.13676358"
            } catch (Throwable ignored) {
            }
        }
    }
    sub.pluginManager.withPlugin("com.android.application") {
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null) {
            try {
                androidExt.ndkVersion = "28.2.13676358"
            } catch (Throwable ignored) {
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
