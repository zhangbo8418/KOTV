allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// AGP 8+：旧插件（如 fijkplayer）缺 namespace 时从 Manifest package 回填。
// 与 scripts/patch-android-plugin-namespaces.sh 双保险。
subprojects { sub ->
    sub.pluginManager.withPlugin("com.android.library") {
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null && (androidExt.namespace == null || androidExt.namespace.toString().trim().isEmpty())) {
            def manifest = sub.file("src/main/AndroidManifest.xml")
            def ns = null
            if (manifest.exists()) {
                def m = (manifest.getText("UTF-8") =~ /package\s*=\s*"([^"]+)"/)
                if (m.find()) ns = m.group(1)
            }
            androidExt.namespace = ns ?: "com.legacy.${sub.name.replace('-', '_')}"
            println "[android] namespace fallback for :${sub.name} -> ${androidExt.namespace}"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
