plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

android {
    namespace = "com.bobo.kotv"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.bobo.kotv"
        minSdk = Math.max(flutter.minSdkVersion, 24)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            // 与 TV 迅雷 AAR / Go 引擎一致：arm64 + armv7
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["src/main/jniLibs"]
        }
    }

    buildTypes {
        release {
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

chaquopy {
    defaultConfig {
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        pip {
            // 与 scripts/python-requirements.txt 对齐（用于 Chaquopy 内执行 Python spider）。
            install "lxml"
            install "ujson"
            install "pyquery"
            install "requests"
            install "cachetools"
            install "pycryptodome"
            install "beautifulsoup4"
            install "certifi"
        }
    }
}

dependencies {
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    // TV 同款迅雷 SDK（含 libxl_*.so）
    implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])
}

flutter {
    source = "../.."
}

// 把 bridge/spider-bridge.jar 拷贝进 APK assets，供 JarLoader 读取。
def repoRoot = file("../../../..")
def bridgeJar = new File(repoRoot, "bridge/spider-bridge.jar")
def bridgeAssetDir = file("src/main/assets/kotv")
def engineSoSrc = new File(repoRoot, "flutter/android/app/src/main/jniLibs/arm64-v8a/libkotv_engine.so")
def engineSoAlt = new File(repoRoot, "flutter/assets/engine/libkotv_engine.so")

tasks.register("prepareSpiderBridgeJar") {
    doLast {
        if (!bridgeJar.exists() || bridgeJar.length() == 0L) {
            println "[android] spider-bridge.jar missing; building..."
            exec {
                commandLine "bash", "-lc", "${repoRoot}/bridge/build.sh"
            }
        }
        bridgeAssetDir.mkdirs()
        copy {
            from bridgeJar
            into bridgeAssetDir
        }
    }
}

tasks.register("prepareKotvEngineSo") {
    doLast {
        def missing = []
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            def jniDir = file("src/main/jniLibs/${abi}")
            jniDir.mkdirs()
            def dest = new File(jniDir, "libkotv_engine.so")
            if (dest.exists() && dest.length() > 0L) {
                println "[android] engine so ok: ${dest}"
                return
            }
            if (abi == "arm64-v8a" && engineSoAlt.exists() && engineSoAlt.length() > 0L) {
                copy {
                    from engineSoAlt
                    into jniDir
                    rename { "libkotv_engine.so" }
                }
                println "[android] copied arm64 engine so from assets/engine"
                return
            }
            missing << abi
        }
        if (!missing.isEmpty()) {
            println "[android] WARNING: libkotv_engine.so missing for ${missing}. Run scripts/build-engine-flutter.sh android"
        }
    }
}

tasks.named("preBuild") {
    dependsOn "prepareSpiderBridgeJar"
    dependsOn "prepareKotvEngineSo"
}
