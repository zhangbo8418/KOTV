plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

android {
    namespace = "com.bobo.kotv"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // thunder-release.aar 要求开启 core library desugaring
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.bobo.kotv"
        minSdk = Math.max(flutter.minSdkVersion, 24)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Chaquopy 需要 abiFilters；勿与 --split-per-abi 同用。
        // 分 ABI 打包由 package-flutter-android.sh 设 KOTV_ABI_FILTERS 后各打一次。
        ndk {
            def abis = (System.getenv("KOTV_ABI_FILTERS") ?: "arm64-v8a,armeabi-v7a")
                .split(",")
                .collect { it.trim() }
                .findAll { !it.isEmpty() }
            abiFilters(*abis)
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["src/main/jniLibs"]
        }
    }

    buildTypes {
        release {
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            // Flutter release 常开 R8；必须带 keep，否则 JarDexer → u1.a 反射失败
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 强制抽出 jniLibs，否则 Process.start(libkotv_engine.so) 无法 exec APK 内压缩库
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        // 默认 3.10：仍支持 armeabi-v7a；3.12+ 仅 64-bit
        version "3.10"
        // CI / 本机需有匹配的 build Python
        def py = System.getenv("CHAQUOPY_BUILD_PYTHON")
        if (py != null && !py.trim().isEmpty()) {
            buildPython py.trim()
        } else {
            buildPython "python3.10"
        }
        // Chaquopy 17：ABI 只认 android.defaultConfig.ndk.abiFilters，不再支持 chaquopy.ndk()
        pip {
            // 与 scripts/python-requirements.txt 对齐（用于 Chaquopy 内执行 Python spider）。
            install "lxml"
            install "ujson"
            install "pyquery"
            install "requests"
            install "cachetools"
            install "pycryptodome"
            install "beautifulsoup4"
            install "certifi"
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    // 站点 spider jar 若只有 .class（桌面 JVM 包），ART 需先转 dex
    implementation "com.jakewharton.android.repackaged:dalvik-dx:9.0.0_r3"
    // 对齐 TV：Exo 走 OkHttp DataSource（video_player 默认 DefaultHttp 易 Source error）
    def media3 = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // TV 同款迅雷 SDK（含 libxl_*.so）
    implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])
}

flutter {
    source = "../.."
}

// 把 bridge/spider-bridge.jar 拷贝进 APK assets，供 JarLoader 读取。
// app/ → android/ → flutter/ → 仓库根（三级，不是四级）
def repoRoot = file("../../..")
def bridgeJar = new File(repoRoot, "bridge/spider-bridge.jar")
def bridgeAssetDir = file("src/main/assets/kotv")
def engineSoAlt = new File(repoRoot, "flutter/assets/engine/libkotv_engine.so")

tasks.register("prepareSpiderBridgeJar") {
    doLast {
        def bridgeSrc = new File(repoRoot, "bridge/src/main/java/com/bobo/kotv/bridge/SpiderBridge.java")
        def needBridgeBuild = !bridgeJar.exists() || bridgeJar.length() == 0L ||
            (bridgeSrc.exists() && bridgeSrc.lastModified() > bridgeJar.lastModified())
        if (needBridgeBuild) {
            println "[android] rebuilding spider-bridge.jar..."
            def toolchain = System.getenv("KOTV_JAVA_TOOLCHAIN") ?: "17"
            exec {
                environment "KOTV_JAVA_TOOLCHAIN", toolchain
                commandLine "bash", "-lc", "${repoRoot}/bridge/build.sh"
            }
        }
        if (!bridgeJar.exists() || bridgeJar.length() == 0L) {
            throw new GradleException("missing ${bridgeJar}")
        }
        bridgeAssetDir.mkdirs()
        // ART 只能加载含 classes.dex 的 jar；桌面 shadowJar 需经 d8 转换。
        def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
        if (sdkDir == null || sdkDir.trim().isEmpty()) {
            def homeSdk = new File(System.getProperty("user.home"), "Library/Android/sdk")
            if (homeSdk.isDirectory()) sdkDir = homeSdk.absolutePath
        }
        if (sdkDir == null || !(new File(sdkDir).isDirectory())) {
            throw new GradleException("ANDROID_HOME/ANDROID_SDK_ROOT required to d8 spider-bridge.jar")
        }
        def buildToolsDir = new File(sdkDir, "build-tools")
        def bt = buildToolsDir.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> b.name <=> a.name }?.find { new File(it, "d8").exists() || new File(it, "d8.bat").exists() }
        if (bt == null) {
            throw new GradleException("d8 not found under ${buildToolsDir}")
        }
        def d8Bin = new File(bt, System.getProperty("os.name").toLowerCase().contains("windows") ? "d8.bat" : "d8")
        def platforms = new File(sdkDir, "platforms")
        def androidJar = platforms.listFiles()?.findAll { it.isDirectory() && new File(it, "android.jar").exists() }?.sort { a, b -> b.name <=> a.name }?.collect { new File(it, "android.jar") }?.find { it.exists() }
        if (androidJar == null) {
            throw new GradleException("android.jar not found under ${platforms}")
        }

        def work = new File(project.layout.buildDirectory.get().asFile, "kotv-bridge-dex")
        def merge = new File(work, "merge")
        work.deleteDir()
        merge.mkdirs()

        println "[android] d8 spider-bridge.jar via ${d8Bin} lib=${androidJar.name}"
        exec {
            commandLine d8Bin.absolutePath,
                "--min-api", "24",
                "--lib", androidJar.absolutePath,
                "--output", work.absolutePath,
                bridgeJar.absolutePath
        }
        def dexFiles = work.listFiles()?.findAll { it.name.startsWith("classes") && it.name.endsWith(".dex") }
        if (dexFiles == null || dexFiles.isEmpty()) {
            throw new GradleException("d8 produced no classes.dex from ${bridgeJar}")
        }
        dexFiles.each { f ->
            copy { from f; into merge }
        }
        // 保留非 .class 资源（META-INF 服务等）；排除签名与 class
        copy {
            from zipTree(bridgeJar)
            into merge
            exclude "**/*.class"
            exclude "META-INF/*.SF"
            exclude "META-INF/*.RSA"
            exclude "META-INF/*.DSA"
            exclude "META-INF/SIG-*"
        }
        def outJar = new File(bridgeAssetDir, "spider-bridge.jar")
        if (outJar.exists()) outJar.delete()
        ant.jar(destfile: outJar.absolutePath, basedir: merge.absolutePath)
        println "[android] dex bridge ready: ${outJar} (${outJar.length()} bytes)"
    }
}

tasks.register("prepareKotvEngineSo") {
    doLast {
        def missing = []
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            def jniDir = file("src/main/jniLibs/${abi}")
            jniDir.mkdirs()
            def dest = new File(jniDir, "libkotv_engine.so")
            if (dest.exists() && dest.length() > 0L) {
                println "[android] engine so ok: ${dest}"
                return
            }
            if (abi == "arm64-v8a" && engineSoAlt.exists() && engineSoAlt.length() > 0L) {
                copy {
                    from engineSoAlt
                    into jniDir
                    rename { "libkotv_engine.so" }
                }
                println "[android] copied arm64 engine so from assets/engine"
                return
            }
            missing << abi
        }
        if (!missing.isEmpty()) {
            println "[android] WARNING: libkotv_engine.so missing for ${missing}. Run scripts/build-engine-flutter.sh android"
        }
    }
}

tasks.named("preBuild") {
    dependsOn "prepareSpiderBridgeJar"
    dependsOn "prepareKotvEngineSo"
}
