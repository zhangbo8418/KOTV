plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

// Chaquopy 不能与 --split-per-abi 同用；分 ABI 由 package-flutter-android.sh 设 KOTV_ABI_FILTERS 各打一次。
// Flutter 3.35+ 默认 abiFilters=armv7+arm64+x86_64，会盖住「单 ABI」意图 → APK lib/ 仍三套都在。
def kotvAbiFilters = (System.getenv("KOTV_ABI_FILTERS") ?: "arm64-v8a,armeabi-v7a")
        .split(",")
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
def kotvAllAbis = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
def repoRoot = file("../../..")
def engineSoAlt = new File(repoRoot, "flutter/assets/engine/libkotv_engine.so")

def kotvTargetSdk = (System.getenv("KOTV_TARGET_SDK") ?: "28").toInteger()

android {
    namespace = "com.bobo.kotv"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // thunder-release.aar 要求开启 core library desugaring
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.bobo.kotv"
        minSdk = Math.max(flutter.minSdkVersion, 24)
        // 社区仓（潇洒哥玩偶等）会把 go 多线程程序下到缓存再 chmod+exec；
        // targetSdk≥29 起系统禁止 exec 应用私有目录可执行文件（W^X），高版本会直接失败。
        // 摸鱼儿玩偶的 so 多线程同样依赖可加载的缓存/库路径，低 target 更稳。
        // 可用 KOTV_TARGET_SDK=34 等覆盖（上架/合规时再抬）。
        // 注意：不要用 flutter.targetSdkVersion（默认 36），CI/本机均默认 28。
        targetSdk = kotvTargetSdk
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            // 清掉 Flutter Gradle Plugin 预置的三 ABI，再写入本包目标
            abiFilters.clear()
            abiFilters.addAll(kotvAbiFilters)
        }
    }

    sourceSets {
        main {
            // libs/jpa：jianpian native（jniLibs/*.so 被 gitignore，所以放可入库目录）
            jniLibs.srcDirs += ["src/main/jniLibs", "libs/jpa"]
        }
    }

    buildTypes {
        release {
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            // Flutter release 常开 R8；必须带 keep，否则 JarDexer → u1.a 反射失败
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters.clear()
                abiFilters.addAll(kotvAbiFilters)
            }
        }
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 强制抽出 jniLibs，否则 Process.start(libkotv_engine.so) 无法 exec APK 内压缩库
    packaging {
        jniLibs {
            useLegacyPackaging = true
            for (abi in kotvAllAbis) {
                if (!kotvAbiFilters.contains(abi)) {
                    excludes += "**/lib/${abi}/**"
                    excludes += "lib/${abi}/**"
                }
            }
        }
        resources {
            // 多 JAR 同名元数据。Android 不用这些文件；漏一条 CI 就会在 mergeJavaResource 再炸一次。
            // 不要 excludes += "META-INF/versions/**"：bcprov 的 MRJAR class 在 versions/9|11|15。
            excludes += "META-INF/DEPENDENCIES"
            excludes += "META-INF/LICENSE"
            excludes += "META-INF/LICENSE.txt"
            excludes += "META-INF/LICENSE.md"
            excludes += "META-INF/NOTICE"
            excludes += "META-INF/NOTICE.txt"
            excludes += "META-INF/NOTICE.md"
            excludes += "META-INF/AL2.0"
            excludes += "META-INF/LGPL2.1"
            excludes += "META-INF/*.SF"
            excludes += "META-INF/*.RSA"
            excludes += "META-INF/*.DSA"
            excludes += "META-INF/INDEX.LIST"
            excludes += "META-INF/versions/**/OSGI-INF/**"
            excludes += "META-INF/versions/**/module-info.class"
            excludes += "**/module-info.class"
            // zstd-jni fat jar：桌面/其它 ISA 的 so/dll/dylib。Android 运行时只读 linux/<arch>/。
            excludes += "darwin/**"
            excludes += "win/**"
            excludes += "aix/**"
            excludes += "freebsd/**"
            excludes += "linux/amd64/**"
            excludes += "linux/i386/**"
            excludes += "linux/ppc64/**"
            excludes += "linux/ppc64le/**"
            excludes += "linux/s390x/**"
            excludes += "linux/riscv64/**"
            excludes += "linux/loongarch64/**"
            excludes += "linux/mips64/**"
            if (!kotvAbiFilters.contains("arm64-v8a")) {
                excludes += "linux/aarch64/**"
            }
            if (!kotvAbiFilters.contains("armeabi-v7a")) {
                excludes += "linux/arm/**"
            }
            pickFirsts += "META-INF/INDEX.LIST"
            pickFirsts += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
            pickFirsts += "META-INF/versions/9/module-info.class"
            for (abi in kotvAllAbis) {
                if (!kotvAbiFilters.contains(abi)) {
                    excludes += "lib/${abi}/**"
                    excludes += "**/lib/${abi}/**"
                    excludes += "chaquopy/**/${abi}/**"
                    excludes += "chaquopy/**/*-${abi}*"
                    excludes += "chaquopy/**/*_${abi}*"
                    excludes += "**/chaquopy/**/${abi}/**"
                    excludes += "**/chaquopy/**/*-${abi}*"
                    excludes += "**/chaquopy/**/*_${abi}*"
                }
            }
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.10"
        def py = System.getenv("CHAQUOPY_BUILD_PYTHON")
        if (py != null && !py.trim().isEmpty()) {
            buildPython py.trim()
        } else {
            buildPython "python3.10"
        }
        pip {
            install "lxml"
            install "ujson"
            install "pyquery"
            install "requests"
            install "cachetools"
            install "pycryptodome"
            install "beautifulsoup4"
            install "certifi"
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
    // 安卓宿主：按 Android SDK 编进 App CL（对齐 TV :catvod）。桌面仍走 bridge/spider-bridge.jar。
    implementation project(":kotv-bridge")
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    // 站点 PC 瘦包（.class）运行时 D8 → dex
    implementation "com.android.tools:r8:8.9.35"
    def media3 = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    // CatVodSpider dex jar 内 JS 依赖 QuickJS JNI，须在 App CL load
    implementation "wang.harlon.quickjs:wrapper-android:3.2.3"
    implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.squareup.okhttp3") {
            details.useVersion("5.4.0")
            details.because("align with kotv-bridge OkHttp 5.4.0")
        }
    }
}

flutter {
    source = "../.."
}

tasks.register("prepareKotvEngineSo") {
    doLast {
        def missing = []
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            def jniDir = file("src/main/jniLibs/${abi}")
            jniDir.mkdirs()
            def dest = new File(jniDir, "libkotv_engine.so")
            if (dest.exists() && dest.length() > 0L) {
                println "[android] engine so ok: ${dest}"
                return
            }
            if (abi == "arm64-v8a" && engineSoAlt.exists() && engineSoAlt.length() > 0L) {
                copy {
                    from engineSoAlt
                    into jniDir
                    rename { "libkotv_engine.so" }
                }
                println "[android] copied arm64 engine so from assets/engine"
                return
            }
            missing << abi
        }
        if (!missing.isEmpty()) {
            println "[android] WARNING: libkotv_engine.so missing for ${missing}. Run scripts/build-engine-flutter.sh android"
        }
    }
}

tasks.named("preBuild") {
    dependsOn "prepareKotvEngineSo"
}

// Flutter Gradle Plugin 偶发在合并后抬高 targetSdk；构建前再钉死一次。
afterEvaluate {
    android.defaultConfig.targetSdk = kotvTargetSdk
    println "[android] pinned targetSdk=${android.defaultConfig.targetSdk} (KOTV_TARGET_SDK=${System.getenv("KOTV_TARGET_SDK") ?: "28"})"
}
