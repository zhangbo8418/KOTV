name: kotv
description: KO影视 Flutter UI（Go 引擎 :9978）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  # 主线不钉死小版本：随当前 Flutter/Dart 解析最新兼容版。
  # Win7 线由 scripts/adapt-flutter-win7-sdk.sh 临时钉到 1.1.11 / 1.2.5。
  media_kit: ">=1.1.11 <2.0.0"
  media_kit_video: ">=1.2.5 <3.0.0"
  media_kit_libs_video: ">=1.0.7 <2.0.0"
  video_player: ^2.9.2
  fijkplayer: ^0.11.0
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  window_manager: 0.4.3
  url_launcher: ^6.3.1
  kotv_vlc:
    path: packages/kotv_vlc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 3.44 默认 SPM；kotv_vlc / media_kit / window_manager 尚未支持，先退回 CocoaPods
  config:
    enable-swift-package-manager: false
  assets:
    - assets/engine/
