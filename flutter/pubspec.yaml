name: kotv
description: KO影视 Flutter UI（Go 引擎 :9978）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  # 主线拉最新兼容版；Win7 线由 adapt-flutter-win7-sdk.sh 尽量钉到同档新版本。
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  video_player: ^2.9.2
  web: ^1.1.0
  fvp: ^0.37.3
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  window_manager: 0.4.3
  url_launcher: ^6.3.1
  # 添加源时选择本机配置文件；桌面走系统原生对话框。
  file_selector: ^1.0.0
  # 播放中防休眠/屏保（手机+桌面）；media_kit_video 也传递依赖，这里升为直接依赖以便统一管控。
  wakelock_plus: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/engine/
  # 内嵌字体仅 Win7 线：adapt-flutter-win7-sdk.sh 注入 fonts + fetch-flutter-fonts.sh（KOTV_WIN7=1）
